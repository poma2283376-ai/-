    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
        });

        document.querySelectorAll('.mobile-nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('active');
            });
        });
    </script>

    <script>
        // Данные карточек — замени title/text/image на свои реальные значения
        // likes/dislikes — стартовые значения счётчика (можно поставить 0/0)
        const items = [
            { id: 1,  title: 'Проект 1',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 1: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 2,  title: 'Проект 2',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 2: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 3,  title: 'Проект 3',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 3: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 4,  title: 'Проект 4',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 4: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 5,  title: 'Проект 5',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 5: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 6,  title: 'Проект 6',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 6: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 7,  title: 'Проект 7',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 7: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 8,  title: 'Проект 8',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 8: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 9,  title: 'Проект 9',  image: 'ССЫЛКА НА ФОТО',  text: 'Описание проекта 9: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 10, title: 'Проект 10', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 10: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 11, title: 'Проект 11', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 11: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 12, title: 'Проект 12', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 12: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 13, title: 'Проект 13', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 13: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 14, title: 'Проект 14', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 14: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 15, title: 'Проект 15', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 15: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 },
            { id: 16, title: 'Проект 16', image: 'ССЫЛКА НА ФОТО', text: 'Описание проекта 16: подробности, условия участия и полезная информация для пользователя.', likes: 0, dislikes: 0 }
        ];

        // Голос пользователя по каждой карточке: 'like' | 'dislike' | null
        // Хранится в памяти на время сессии (сбрасывается при перезагрузке страницы)
        const userVotes = {};

        function getPercent(item) {
            const total = item.likes + item.dislikes;
            if (total === 0) return 0;
            return Math.round((item.likes / total) * 100);
        }

        function renderRatingHTML(item, size) {
            const pct = getPercent(item);
            const total = item.likes + item.dislikes;
            const vote = userVotes[item.id];
            const cls = size === 'modal' ? ' modal-rating-inner' : '';
            return `
                <div class="rating-block${cls}" data-item-id="${item.id}">
                    <div class="rating-row">
                        <div class="rating-bar-track">
                            <div class="rating-bar-fill" style="width:${pct}%;"></div>
                        </div>
                        <span class="rating-pct">${total > 0 ? pct + '%' : '—'}</span>
                    </div>
                    <div class="rating-votes">${total} ${voteWord(total)}</div>
                    <div class="rating-btns">
                        <button class="vote-btn like ${vote === 'like' ? 'active' : ''}" data-action="like" data-item-id="${item.id}">
                            👍 <span class="count">${item.likes}</span>
                        </button>
                        <button class="vote-btn dislike ${vote === 'dislike' ? 'active' : ''}" data-action="dislike" data-item-id="${item.id}">
                            👎 <span class="count">${item.dislikes}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function voteWord(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'оценка';
            if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'оценки';
            return 'оценок';
        }

        function handleVoteClick(action, itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;
            const current = userVotes[itemId];

            if (current === action) {
                // отменить голос
                item[action === 'like' ? 'likes' : 'dislikes']--;
                userVotes[itemId] = null;
            } else {
                // если ранее был другой голос — убрать его
                if (current) {
                    item[current === 'like' ? 'likes' : 'dislikes']--;
                }
                item[action === 'like' ? 'likes' : 'dislikes']++;
                userVotes[itemId] = action;
            }
            refreshAllRatings();
        }

        function refreshAllRatings() {
            document.querySelectorAll('.rating-block').forEach(block => {
                const id = parseInt(block.dataset.itemId, 10);
                const item = items.find(i => i.id === id);
                block.outerHTML = renderRatingHTML(item, block.classList.contains('modal-rating-inner') ? 'modal' : 'card');
            });
            attachRatingListeners();
        }

        function attachRatingListeners() {
            document.querySelectorAll('.vote-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    handleVoteClick(btn.dataset.action, parseInt(btn.dataset.itemId, 10));
                };
            });
        }

        const grid = document.getElementById('products');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalRating = document.getElementById('modalRating');
        const modalClose = document.getElementById('modalClose');

        function openModal(item) {
            modalTitle.textContent = item.title;
            modalText.textContent = item.text;
            modalImage.style.backgroundImage = item.image ? `url('${item.image}')` : '';
            modalImage.style.backgroundSize = 'cover';
            modalImage.style.backgroundPosition = 'center';
            modalRating.innerHTML = renderRatingHTML(item, 'modal');
            attachRatingListeners();
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        items.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-image" style="background-image:url('${item.image}');background-size:cover;background-position:center;">
                </div>
                <div class="card-body">
                    <div class="card-title">${item.title}</div>
                    ${renderRatingHTML(item, 'card')}
                </div>
            `;
            card.addEventListener('click', (e) => {
                if (e.target.closest('.vote-btn')) return;
                openModal(item);
            });
            grid.appendChild(card);
        });

        attachRatingListeners();
    </script>
</body>
